plugins { id 'com.android.application' }
android {
    namespace 'pro.vymi.terrastorm'
    compileSdk 35
    defaultConfig {
        applicationId 'pro.vymi.terrastorm'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '0.20.0'
    }
    signingConfigs {
        release {
            enableV3Signing true
            if (System.getenv('TERRA_KEYSTORE_FILE')) {
                storeFile file(System.getenv('TERRA_KEYSTORE_FILE'))
                storePassword System.getenv('TERRA_KEYSTORE_PASSWORD')
                keyAlias 'terrastorm'
                keyPassword System.getenv('TERRA_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('TERRA_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

tasks.register("prepareReferenceVisuals", Copy) {
from zipTree(rootProject.file("reference-content/visuals.zip"))
from zipTree(rootProject.file("reference-content/unit-textures.zip"))
into "src/main/assets/game/reference/images"
}
tasks.named("preBuild").configure { dependsOn "prepareReferenceVisuals" }

dependencies {
 implementation 'com.yandex.android:mobileads:8.6.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}
