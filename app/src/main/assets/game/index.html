<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#edf2f7"><title>Терра Шторм</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app">
 <canvas id="map" aria-label="Карта территорий. Перетащите палец от своей базы к цели."></canvas>
 <div id="loading"><div class="load-logo"><span class="logo-mark"></span><strong>ТЕРРА<br>ШТОРМ</strong></div><p>Мир ждёт твоей стратегии</p><div class="load-line"><i></i></div><small>ЗАГРУЗКА</small></div>
 <header id="header"><button class="square" id="settings" aria-label="Настройки"></button><div class="brand">ТЕРРА<span>ШТОРМ</span></div><div class="wallet"><span id="coin-icon"></span><b id="coins">0</b></div></header>
 <section id="menu-top"><div class="level-banner"><span id="level-label">УРОВЕНЬ 1</span><button id="level-open" aria-label="Выбрать уровень"></button></div><div class="campaign-progress"><span>ПОКОРЕНИЕ МИРА</span><div id="campaign-dots"></div></div></section>
 <section id="battle-top" hidden><div class="battle-title"><button id="pause" class="square" aria-label="Пауза"></button><div><b id="battle-label"></b><span id="battle-time">0:00</span></div><button id="help" class="square" aria-label="Как играть"></button></div><div id="balance"></div><div id="force-counts"></div></section>
 <div id="map-caption"><b id="map-name"></b><span id="map-subtitle"></span></div>
 <div id="side-menu"><button id="gift" aria-label="Ежедневная награда"><span></span><small>ПОДАРОК</small><i></i></button><button id="leader" aria-label="Командир"><span></span><small>КОМАНДИР</small></button></div>
 <div id="hint" hidden></div><button id="zoom-reset" hidden aria-label="Вернуть масштаб">1:1</button>
 <section id="menu-bottom"><button id="play" class="primary"><span id="play-label">ИГРАТЬ</span><span id="play-arrow"></span></button><div class="upgrade-title">УСИЛЬ СВОЮ АРМИЮ</div><div id="upgrades"></div><nav><button id="nav-army"><span></span><small>АРМИЯ</small></button><button class="active" id="nav-world"><span></span><small>МИР</small></button><button id="nav-tasks"><span></span><small>ЗАДАНИЯ</small><i></i></button></nav></section>
 <section id="battle-bottom" hidden><div id="skill-hint">Проведи от своей базы к цели</div><div class="battle-tools"><button id="select-all"><span></span><small>ВСЕ БАЗЫ</small></button><button id="fraction"><b>100%</b><small>ОТПРАВИТЬ</small></button><button id="reinforce"><span></span><small>+25 БОЙЦОВ</small><i>1</i></button><button id="shield"><span></span><small>ЩИТ</small><i>1</i></button></div><div id="region-status"></div></section>
 <div id="modal" hidden><div id="scrim"></div><section id="panel" role="dialog" aria-modal="true"><div id="panel-content"></div></section></div><div id="toast" role="status"></div>
</div><script src="maps.js"></script><script src="engine.js"></script><script src="app.js"></script></body></html>
