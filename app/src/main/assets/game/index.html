<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#4569bb"><title>Терра Шторм</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="premium.css"><link rel="stylesheet" href="battle.css"><link rel="stylesheet" href="expansion.css"></head><body>
<div id="app">
 <canvas id="map" aria-label="Карта территорий. Перетащите палец от своей базы к цели."></canvas>
 <div id="countdown" hidden aria-live="polite"><b>3</b><span>ДУЭЛЬ С БОТОМ</span></div><div id="loading"><div class="load-logo"><span class="logo-mark"></span><strong>ТЕРРА<br>ШТОРМ</strong></div><p>Мир ждёт твоей стратегии</p><div class="load-line"><i></i></div><small>ЗАГРУЗКА</small></div>
 <header id="header"><button class="square" id="settings" aria-label="Настройки"></button><div class="currency-row"><button class="wallet" id="wallet-coins" aria-label="Магазин монет"><span id="coin-icon"></span><b id="coins">0</b><i>+</i></button><button class="wallet gems" id="wallet-gems" aria-label="Магазин кристаллов"><span class="resource-icon resource-gems" aria-hidden="true"></span><b id="gems">0</b><i>+</i></button><button class="wallet energy" id="wallet-supply" aria-label="Запасы"><span class="resource-icon resource-supply" aria-hidden="true"></span><b id="supply">0</b><i>+</i></button><button class="wallet tickets" id="wallet-tickets" aria-label="Билеты"><span class="resource-icon resource-tickets" aria-hidden="true"></span><b id="tickets">0</b><i>+</i></button></div></header>
 <section id="menu-top"><div class="level-banner"><span id="level-label">УРОВЕНЬ 1</span><button id="level-open" aria-label="Выбрать уровень"></button></div><div class="campaign-progress"><span>ПОКОРЕНИЕ МИРА</span><div id="campaign-dots"></div></div></section>
 <section id="battle-top" hidden><div class="battle-title"><button id="pause" class="square" aria-label="Пауза"></button><div><b id="battle-label"></b><span id="battle-time">0:00</span></div><button id="help" class="square" aria-label="Как играть"></button></div><div id="balance"></div><div id="stage-label" hidden></div><div id="force-counts"></div></section>
 <div id="selection-info" hidden></div><div id="fraction-panel" hidden><div><b>ЧАСТЬ ОТРЯДА</b><button id="fraction-close" aria-label="Закрыть выбор отряда">×</button></div><strong id="fraction-value">100%</strong><input id="fraction-range" type="range" min="5" max="100" value="100" step="5" aria-label="Процент отправляемого отряда"><div class="fraction-presets"><button data-fraction="25">25%</button><button data-fraction="50">50%</button><button data-fraction="75">75%</button><button data-fraction="100">100%</button></div></div><div id="map-caption"><b id="map-name"></b><span id="map-subtitle"></span><div id="map-modifiers"></div></div>
 <div id="meta-shortcuts"><button data-feature="duel" aria-label="Дуэль с ботом"><span class="shortcut-medal">⚔</span><small>ДУЭЛЬ</small></button><button data-feature="wheel" aria-label="Колесо наград"><span class="shortcut-wheel"></span><small>КОЛЕСО</small></button><button data-feature="rush" aria-label="Гонка территорий"><span class="shortcut-rush">⚑</span><small>ГОНКА</small></button></div><div id="side-menu"><button id="gift" aria-label="Ежедневная награда"><span></span><small>ПОДАРОК</small><i></i></button><button id="leader" aria-label="Арсенал лидеров"><span></span><small>ЛИДЕРЫ</small></button><button id="quests" aria-label="Задания"><span></span><small>ЗАДАНИЯ</small></button></div><div id="main-loadout"></div>
 <section id="hub-screen" hidden></section><nav id="global-nav"><button id="nav-store"><span></span><small>МАГАЗИН</small></button><button id="nav-army"><span></span><small>АРСЕНАЛ</small></button><button class="active" id="nav-world"><span></span><small>ИГРАТЬ</small></button><button id="nav-upgrades"><span></span><small>РАЗВИТИЕ</small></button><button id="nav-albums"><span></span><small>АЛЬБОМЫ</small></button><button id="nav-events"><span></span><small>СОБЫТИЯ</small><i></i></button></nav><div id="hint" hidden></div><button id="zoom-reset" hidden aria-label="Вернуть масштаб">1:1</button>
 <section id="menu-bottom"><button id="play" class="primary"><span id="play-label">ИГРАТЬ</span><span id="play-arrow"></span></button><div class="upgrade-title">УСИЛЬ СВОЮ АРМИЮ</div><div id="upgrades"></div></section>
 <section id="battle-bottom" hidden><div id="skill-hint">Проведи от своей базы к цели</div><div class="battle-tools"><button id="select-all"><span></span><small>ВСЕ БАЗЫ</small></button><button id="fraction"><b>100%</b><small>ОТПРАВИТЬ</small></button><button id="reinforce"><span></span><small>+25 БОЙЦОВ</small><i>1</i></button><button id="shield"><span></span><small>ЩИТ</small><i>1</i></button><button id="leader-skill"><span></span><small>КОМАНДИР</small><i>1</i></button></div><div id="region-status"></div></section>
 <div id="modal" hidden><div id="scrim"></div><section id="panel" role="dialog" aria-modal="true"><div id="panel-content"></div></section></div><div id="toast" role="status"></div>
</div><script src="maps.js"></script><script src="reference-levels.js"></script><script src="campaign.js"></script><script src="ui.js"></script><script src="field.js"></script><script src="engine.js"></script><script src="collection.js"></script><script src="meta.js"></script><script src="features.js"></script><script src="screens.js"></script><script src="app.js"></script></body></html>
